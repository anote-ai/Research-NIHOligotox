[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "oligotoxdb"
version = "0.1.0"
description = "OligoToxDB: Open dataset and ML toolkit for oligonucleotide toxicity prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Natan Vidra", email = "oligotoxdb@anote.ai" }]
keywords = ["oligonucleotide", "toxicity", "machine-learning", "drug-discovery", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.44",
    "duckdb>=0.10",
    "biopython>=1.83",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "accelerate>=0.29",
    "GPy>=1.13",
]
portal = [
    "gradio>=4.26",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
oligotox-features = "oligotoxdb.features:cli"
oligotox-qc = "oligotoxdb.qc:cli"
oligotox-train = "models.xgb_model:cli"
oligotox-active = "models.active_learning:cli"
oligotox-portal = "portal.app:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
