name: OligoToxDB CI

on:
  push:
    branches: [main, "claude/*", develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn xgboost shap duckdb biopython \
                      pydantic click rich tqdm pytest pytest-cov

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check oligotoxdb/ models/ benchmarks/ --ignore E501,E402

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=oligotoxdb --cov-report=term-missing --cov-report=xml
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  synthetic-data-pipeline:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn xgboost shap duckdb pydantic \
                      click rich tqdm pytest

      - name: Generate synthetic data
        run: |
          python scripts/generate_synthetic_data.py \
            --n-oligos 50 \
            --output data/ci_test/ \
            --tier 3
        working-directory: ${{ github.workspace }}/oligotoxdb

      - name: Compute features
        run: |
          python -c "
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from oligotoxdb.features import compute_features_batch
          df = pd.read_csv('data/ci_test/compounds.csv')
          feat_df = compute_features_batch(df)
          feat_df.to_csv('data/ci_test/features.csv', index=False)
          print(f'Features computed: {len(feat_df)} rows x {len(feat_df.columns)} cols')
          "
        working-directory: ${{ github.workspace }}/oligotoxdb

      - name: Run QC pipeline
        run: |
          python -c "
          import pandas as pd, sys
          sys.path.insert(0, '.')
          from oligotoxdb.qc import run_qc_pipeline
          results = pd.read_csv('data/ci_test/results.csv')
          controls = pd.read_csv('data/ci_test/plate_controls.csv')
          plate_qc, dr = run_qc_pipeline(results, controls)
          print(f'Plate QC: {plate_qc[\"passed\"].sum()}/{len(plate_qc)} passed')
          print(f'DR fits: {dr[\"fit_success\"].sum()}/{len(dr)} successful')
          assert plate_qc['passed'].mean() > 0.8, 'Too many plates failed QC'
          assert dr['fit_success'].mean() > 0.5, 'Too many DR fits failed'
          "
        working-directory: ${{ github.workspace }}/oligotoxdb

      - name: Train XGB model (smoke test)
        run: |
          python -c "
          import pandas as pd, numpy as np, sys
          sys.path.insert(0, '.')
          from oligotoxdb.features import compute_features_batch
          from models.xgb_model import OligoToxXGB

          df = pd.read_csv('data/ci_test/compounds.csv')
          feat_df = compute_features_batch(df)
          Xf = feat_df.drop(columns=['oligo_id', 'sequence'], errors='ignore')

          # Synthetic labels
          rng = np.random.default_rng(42)
          y = pd.Series(rng.uniform(-1, 2, len(Xf)), name='log10_ic50')
          model = OligoToxXGB(endpoints=['Cell_viability_ATPLite'])
          model.fit(Xf.assign(oligo_id=feat_df['oligo_id']), {'Cell_viability_ATPLite': y})
          print('XGB smoke test passed.')
          "
        working-directory: ${{ github.workspace }}/oligotoxdb
